name: Build & Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.15.1
        uses: mlugg/setup-zig@v2
        with:
          version: '0.15.1'

      - name: Build firmware
        run: zig build

      - name: Run unit tests
        run: zig build test
